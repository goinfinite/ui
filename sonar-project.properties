# Generated files are not reviewed by hand; their findings are noise.
# Policy: AGENTS.override.md, "Autogenerated Files".
sonar.exclusions=**/*_templ.go,docs/index.html
sonar.cpd.exclusions=**/*_templ.go,docs/index.html

# Sonar S2699 does not count Playwright's expect.poll as an assertion, so it
# flags every spec that waits on poll. The specs do assert; ignore the rule.
sonar.issue.ignore.multicriteria=playwrightPollAssertion
sonar.issue.ignore.multicriteria.playwrightPollAssertion.ruleKey=javascript:S2699
sonar.issue.ignore.multicriteria.playwrightPollAssertion.resourceKey=tests/ui/specs/**/*.js
